name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      JWT_SECRET: ci-test-secret-that-is-long-enough-0123456789
      JWT_REFRESH_SECRET: ci-test-refresh-secret-that-is-long-enough-0123456789

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + integration tests (API)
        run: npm run test -w packages/api

      - name: Build all packages
        run: npm run build